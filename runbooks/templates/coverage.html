<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runbook coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Terminal palette from fredvanelli.dev: warm black, Claude orange, prompt green. Dark only, by design. */
  :root {
    color-scheme: dark;
    --bg: #0e0d0b; --panel: #161512; --line: #2a2823; --fg: #ebe8e1; --muted: #9a968c;
    --accent: #e07a55; --prompt: #8fbf6a; --failed: #e5655c; --blocked: #d9a441;
    --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
  main { flex: 1; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 16px; }
  header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; font: 600 14px var(--mono); }
  header .count { color: var(--muted); font-weight: 400; font-size: 13px; }
  .accent { color: var(--accent); }
  main .wrap { padding-top: 40px; padding-bottom: 64px; }
  input { display: block; width: 100%; max-width: 380px; margin-bottom: 20px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: 14px var(--mono); outline: none; transition: border-color .15s; }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  .table { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 12px 20px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); color: var(--muted); font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  td { padding: 16px 20px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
  .id { color: var(--prompt); font: 13px var(--mono); white-space: nowrap; }
  .title { color: color-mix(in srgb, var(--fg) 90%, transparent); }
  .date { color: var(--muted); font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 999px; font: 500 12px var(--mono); white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .approved { --c: var(--prompt); } .failed { --c: var(--failed); } .blocked { --c: var(--blocked); } .never { --c: var(--muted); }
  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-top: 32px; padding-bottom: 32px; color: var(--muted); font: 12px var(--mono); }
  footer a { color: inherit; text-decoration: none; transition: color .15s; }
  footer a:hover { color: var(--fg); }
  #empty, .none { margin: 0; padding: 32px 20px; text-align: center; color: var(--muted); font: 14px var(--mono); }
  h2 { margin: 48px 0 16px; color: var(--muted); font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  h2:first-child { margin-top: 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .stat { padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .stat .label { color: var(--muted); font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .value { margin: 6px 0 2px; font: 600 28px var(--mono); font-variant-numeric: tabular-nums; }
  .stat .detail { color: var(--muted); font: 13px var(--mono); }
  .num { font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { display: flex; width: 160px; height: 6px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .bar span { display: block; height: 100%; }
  .bar .covered { background: var(--prompt); } .bar .pending { background: var(--blocked); } .bar .planned { background: var(--muted); }
  .meter { display: flex; align-items: center; gap: 12px; }
  .muted { color: var(--muted); font: 13px var(--mono); }
  .problem { color: var(--failed); }
  .group { cursor: pointer; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .toggle:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  .chevron { width: 12px; height: 12px; color: var(--muted); transition: transform .15s; }
  .toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
  tr.item td { padding-top: 10px; padding-bottom: 10px; background: color-mix(in srgb, var(--bg) 45%, transparent); }
  tr.item td:first-child { padding-left: 42px; }
  .item-id { color: color-mix(in srgb, var(--fg) 90%, transparent); font: 13px var(--mono); white-space: nowrap; }
  .item-file { display: block; color: var(--muted); font: 12px var(--mono); }
  .check { width: 16px; height: 16px; color: var(--c); }
  .check-covered { --c: var(--prompt); } .check-pending { --c: var(--blocked); } .check-planned { --c: var(--muted); }
  .tests { color: var(--muted); font: 12px var(--mono); }
  .tests div + div { margin-top: 4px; }
  .path-part { white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="wrap"><span><span class="accent">❯</span> Runbook coverage</span><span class="count" id="count"></span></div>
</header>
<main>
  <section class="wrap">
    <h2>Overall</h2>
    <div class="stats" id="stats"></div>

    <h2>By slice</h2>
    <div class="table">
      <table>
        <thead><tr><th>Slice</th><th>Covered</th><th>Pending</th><th>Planned</th><th>Total</th><th>Coverage</th></tr></thead>
        <tbody id="slices"></tbody>
      </table>
    </div>

    <h2>Uncovered</h2>
    <input id="filter" type="search" placeholder="Filter by id or file" aria-label="Filter uncovered items">
    <div class="table">
      <table>
        <thead><tr><th>Id</th><th>Kind</th><th>Where</th></tr></thead>
        <tbody id="uncovered"></tbody>
      </table>
      <p id="empty" hidden>Nothing matches.</p>
    </div>

    <h2>Orphans</h2>
    <div class="table" id="orphans"></div>

    <h2>Invalid runbooks</h2>
    <div class="table" id="invalid"></div>
  </section>
</main>
<footer>
  <div class="wrap">Created by <a href="https://fredvanelli.dev" target="_blank" rel="noreferrer">fredvanelli.dev ↗</a></div>
</footer>
<script>
  const data = /*DATA*/null
  const pct = (part, total) => (total === 0 ? 'n/a' : `${Math.round((part / total) * 1000) / 10}%`)
  const el = (tag, text, className) => {
    const node = document.createElement(tag)
    if (text !== undefined) node.textContent = text
    if (className) node.className = className
    return node
  }
  const row = (cells) => {
    const tr = el('tr')
    for (const [content, className] of cells) {
      const td = tr.appendChild(el('td', undefined, className))
      td.append(content)
    }
    return tr
  }
  const bar = ({ covered, pending, planned, total }) => {
    const node = el('div', undefined, 'bar')
    for (const [name, value] of [['covered', covered], ['pending', pending], ['planned', planned]]) {
      const part = node.appendChild(el('span', undefined, name))
      part.style.width = total === 0 ? '0' : `${(value / total) * 100}%`
    }
    return node
  }
  const meter = (counts) => {
    const node = el('div', undefined, 'meter')
    node.append(bar(counts), el('span', pct(counts.covered, counts.total), 'num'))
    return node
  }
  const table = (header, rows, empty) => {
    if (rows.length === 0) return [el('p', empty, 'none')]
    const t = el('table')
    const head = t.appendChild(el('thead')).appendChild(el('tr'))
    for (const name of header) head.append(el('th', name))
    t.appendChild(el('tbody')).append(...rows)
    return [t]
  }

  const e = data.entries
  const r = data.requirements
  const rb = data.runbooks
  const stat = (label, value, detail) => {
    const node = el('div', undefined, 'stat')
    node.append(el('div', label, 'label'), el('div', value, 'value'), el('div', detail, 'detail'))
    return node
  }
  document.getElementById('stats').append(
    stat('Entry points', pct(e.covered, e.total), `${e.covered} of ${e.total} covered · ${e.pending} pending · ${e.planned} planned`),
    r ? stat('Requirements', pct(r.covered, r.total), `${r.covered} of ${r.total} covered · ${r.pending} pending · ${r.planned} planned`)
      : stat('Requirements', '-', data.requirementsNote ?? 'no requirement source configured'),
    stat('Runbooks', String(rb.active), `active · ${rb.draft} draft · ${rb.placeholder} placeholder`),
    stat('With a script', String(rb.automated), `of ${rb.active} active`),
  )
  document.getElementById('count').textContent = `entry points ${pct(e.covered, e.total)}`

  const SVG = 'http://www.w3.org/2000/svg'
  const icon = (className, points) => {
    const svg = document.createElementNS(SVG, 'svg')
    svg.setAttribute('viewBox', '0 0 16 16')
    svg.setAttribute('class', className)
    svg.setAttribute('aria-hidden', 'true')
    const line = svg.appendChild(document.createElementNS(SVG, 'polyline'))
    for (const [name, value] of [['points', points], ['fill', 'none'], ['stroke', 'currentColor'], ['stroke-width', '2'], ['stroke-linecap', 'round'], ['stroke-linejoin', 'round']]) {
      line.setAttribute(name, value)
    }
    return svg
  }
  // A check in the column of the item's state; an uncovered item has none.
  const check = (item, state) => {
    if (item.state !== state) return ''
    const node = icon(`check check-${state}`, '3,8.5 6.5,12 13,4.5')
    node.setAttribute('aria-hidden', 'false')
    node.setAttribute('role', 'img')
    node.setAttribute('aria-label', state)
    return node
  }
  // A path that wraps only after a slash.
  const pathText = (text, tag = 'div', className) => {
    const node = el(tag, undefined, className)
    text.split('/').forEach((part, index, parts) => {
      node.append(el('span', part + (index < parts.length - 1 ? '/' : ''), 'path-part'))
      if (index < parts.length - 1) node.append(el('wbr'))
    })
    return node
  }
  const tests = (paths) => {
    if (paths.length === 0) return el('span', '-', 'muted')
    const node = el('div')
    node.append(...paths.map((p) => pathText(p)))
    return node
  }

  const slices = document.getElementById('slices')
  for (const g of data.groups) {
    const items = g.items ?? []
    const toggle = el('button', undefined, 'toggle')
    toggle.type = 'button'
    toggle.setAttribute('aria-expanded', 'false')
    toggle.append(icon('chevron', '6,3 11,8 6,13'), g.surface ? `${g.name} (${g.surface})` : g.name)
    const tr = row([
      [toggle, 'id'], [String(g.covered), 'num'], [String(g.pending), 'num'], [String(g.planned), 'num'], [String(g.total), 'num'],
      [meter(g)],
    ])
    tr.className = 'group'
    const children = items.map((item) => {
      const name = el('span', item.id, 'item-id')
      const cell = el('div')
      cell.append(name)
      if (item.file) cell.append(pathText(item.file, 'span', 'item-file'))
      // The test paths take the space under Total and Coverage.
      const child = row([[cell], [check(item, 'covered')], [check(item, 'pending')], [check(item, 'planned')], [tests(item.tests), 'tests']])
      child.lastChild.colSpan = 2
      child.className = 'item'
      child.hidden = true
      return child
    })
    tr.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') !== 'true'
      toggle.setAttribute('aria-expanded', String(open))
      for (const child of children) child.hidden = !open
    })
    slices.append(tr, ...children)
  }

  const uncovered = [
    ...e.uncovered.map((i) => ({ id: i.id, kind: i.kind ?? 'entry', where: [i.file, i.citedByMocked && 'cited, not covered (mocked)'].filter(Boolean).join(' · ') })),
    ...(r ? r.uncovered.map((i) => ({ id: i.id, kind: 'requirement', where: i.title ?? '' })) : []),
  ]
  const body = document.getElementById('uncovered')
  for (const item of uncovered) {
    const tr = row([[item.id, 'id'], [item.kind, 'muted'], [item.where || '-', 'muted']])
    tr.dataset.text = `${item.id} ${item.where}`.toLowerCase()
    body.append(tr)
  }
  document.getElementById('empty').hidden = uncovered.length > 0
  if (uncovered.length === 0) document.getElementById('empty').textContent = 'Everything is covered.'
  document.getElementById('filter').addEventListener('input', (event) => {
    const query = event.target.value.trim().toLowerCase()
    let shown = 0
    for (const tr of body.querySelectorAll('tr')) {
      tr.hidden = !tr.dataset.text.includes(query)
      if (!tr.hidden) shown++
    }
    document.getElementById('empty').hidden = shown > 0
  })

  const skipped = data.orphanChecksSkipped ?? []
  document.getElementById('orphans').append(...table(['Runbook', 'Cites', 'Missing id'],
    data.orphans.map((o) => row([[o.runbook, 'id'], [o.kind, 'muted'], [o.ref, 'problem']])),
    skipped.length > 0 ? `Orphan check skipped for ${skipped.join(', ')}: a source did not run.` : 'None.'))
  document.getElementById('invalid').append(...table(['Runbook', 'Problems'],
    data.invalid.map((i) => row([[i.path, 'id'], [i.problems.join('; '), 'problem']])), 'None.'))
</script>
</body>
</html>
